plugins { id 'com.android.application' version '8.8.2' }
android {
    namespace 'dev.a16.aodclocktest'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.a16.aodclocktest'
        minSdk 35
        targetSdk 35
        versionCode 9
        versionName '0.9-native-aod-plugin'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
}
dependencies { compileOnly project(':xposedstubs') }
